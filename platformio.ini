; Label cutter build of Grbl_ESP32 for the ESP32-S3 N8R2
; (8 MB quad flash, 2 MB quad PSRAM).
;
; Requires the pioarduino platform 55.03.39 (Arduino core 3.3.9 / ESP-IDF 5.5).
; If it is not installed yet, replace the platform line with
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
;
;   pio run                 build
;   pio run -t upload       flash over the USB-serial port (UART0)
;   pio device monitor      console at 115200 baud

[platformio]
src_dir = Grbl_Esp32
default_envs = release

[env]
platform = espressif32 @ 55.3.39
board = esp32-s3-devkitc1-n8r2
framework = arduino
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_eol = LF
build_flags =
	; UART0 (GPIO43/44) is the console; the native USB port is not used.
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1

[env:release]
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=3
